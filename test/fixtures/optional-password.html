<!doctype html><html><body>
<h1>Apply: Backend Engineer</h1>
<form onsubmit="event.preventDefault(); window.submitted = true">
  <label for="fn">First Name *</label><input id="fn" required>
  <label for="ln">Last Name *</label><input id="ln" required>
  <label for="em">Email *</label><input id="em" type="email" required>
  <label for="ph">Phone</label><input id="ph" type="tel">
  <label for="cv">Resume *</label><input id="cv" type="file">
  <label for="why">Why us?</label><textarea id="why"></textarea>
  <label for="pw">Create a password to track your application (optional)</label><input id="pw" type="password">
  <button type="submit">Continue</button>
  <button type="submit">Submit Application</button>
</form></body></html>
