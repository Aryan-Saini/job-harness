<!doctype html>
<!-- LinkedIn's 2026 Easy Apply markup: the question is a <p> above the fieldset, each radio's
     <label> is empty, the option text is a <p> beside it, and role=radio carries the question. -->
<html><body>
<div>
  <p>Are you currently legally eligible to work in Canada?*</p>
  <fieldset role="radiogroup"><div>
    <div role="radio" aria-label="Are you currently legally eligible to work in Canada?" aria-checked="false"><div>
      <div><input id="r1" type="radio" name="radio-group-a"><label for="r1"></label></div>
      <div><p>Yes</p></div>
    </div></div>
    <div role="radio" aria-label="Are you currently legally eligible to work in Canada?" aria-checked="false"><div>
      <div><input id="r2" type="radio" name="radio-group-a"><label for="r2"></label></div>
      <div><p>No</p></div>
    </div></div>
  </div></fieldset>
</div>
</body></html>
