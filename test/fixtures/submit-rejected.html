<!doctype html><html><body>
<h1>Backend Engineer at Rejectco</h1>
<form onsubmit="event.preventDefault(); document.getElementById('err').hidden = false">
  <label for="fn">First Name *</label><input id="fn" required>
  <label for="ln">Last Name *</label><input id="ln" required>
  <label for="em">Email *</label><input id="em" type="email" required>
  <div id="err" role="alert" hidden>Something went wrong, please try again</div>
  <button type="submit">Submit Application</button>
</form></body></html>
