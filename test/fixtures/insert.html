<!doctype html><html><body>
<form id="f" onsubmit="event.preventDefault()">
  <label for="em">Email *</label><input id="em" type="email" required>
  <label for="sal">Expected salary</label><input id="sal">
  <label>Are you authorized to work in Canada? <select id="auth"><option value="">Select...</option><option>Yes</option><option>No</option></select></label>
  <fieldset><legend>Sponsorship?</legend>
    <label><input type="radio" name="sp" value="y"> Yes</label><label><input type="radio" name="sp" value="n"> No</label></fieldset>
</form>
<script>
  // A conditional question showing up above the others, as SPA forms do.
  function insertField() {
    const f = document.getElementById("f");
    f.insertAdjacentHTML("afterbegin", '<label for="ph">Phone</label><input id="ph" type="tel">');
  }
</script>
</body></html>
