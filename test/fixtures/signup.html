<!doctype html><html><body>
<div id="signin"><h2>Sign In</h2>
  <label for="e1">Email Address</label><input id="e1" type="text" data-automation-id="email">
  <label for="p1">Password</label><input id="p1" type="password">
  <button onclick="location.hash='done'">Sign In</button>
  <a href="#" onclick="document.getElementById('signin').remove(); document.getElementById('create').hidden=false; return false;">Create Account</a></div>
<div id="create" hidden><h2>Create Account</h2>
  <label for="e2">Email Address*</label><input id="e2" type="text" data-automation-id="email">
  <label for="p2">Password*</label><input id="p2" type="password">
  <label for="p3">Verify New Password*</label><input id="p3" type="password">
  <label><input type="checkbox" id="agree"> I agree</label>
  <button onclick="window.created = [e2.value, p2.value, p3.value, agree.checked]; document.body.innerHTML = '<label for=fn>First Name</label><input id=fn><label for=ln>Last Name</label><input id=ln><button>Next</button>';">Create Account</button></div>
</body></html>
